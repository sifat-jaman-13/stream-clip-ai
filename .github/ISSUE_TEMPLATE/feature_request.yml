name: Feature request
description: Suggest a focused improvement to StreamSnip AI
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the creator workflow or limitation behind the request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and where it should appear in the app.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: impact
    attributes:
      label: External-service impact
      options:
        - label: This may require a new hosted service, API key, paid quota, or non-local data transfer.
        - label: This changes installer, Python runtime, GPU, or platform requirements.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include credentials or private creator content.
          required: true
