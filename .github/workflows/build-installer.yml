name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Windows x64 · FastAPI + React + pywebview
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $programFiles = [Environment]::GetEnvironmentVariable("ProgramFiles")
          $iscc = @(
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
            (Join-Path $programFiles "Inno Setup 6\ISCC.exe")
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }

      - name: Build React frontend, pywebview shell and Windows installer
        shell: pwsh
        run: .\build_installer.ps1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSnipAI-Setup
          path: |
            dist/installer/StreamSnipAI-Setup.exe
            dist/installer/StreamSnipAI-Setup.exe.sha256

      - name: Attach Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/StreamSnipAI-Setup.exe
            dist/installer/StreamSnipAI-Setup.exe.sha256
