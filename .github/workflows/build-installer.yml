name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "dashboard/package-lock.json"

      - name: Build Creator Studio dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }

      - name: Build StreamSnipAI-Setup.exe
        shell: pwsh
        run: .\build_windows.ps1

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $setup = "dist\installer\StreamSnipAI-Setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  StreamSnipAI-Setup.exe" | Set-Content -Path "dist\installer\StreamSnipAI-Setup.exe.sha256" -Encoding ASCII
          Write-Host "SHA-256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSnipAI-Setup
          path: |
            dist/installer/StreamSnipAI-Setup.exe
            dist/installer/StreamSnipAI-Setup.exe.sha256

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/StreamSnipAI-Setup.exe
            dist/installer/StreamSnipAI-Setup.exe.sha256
