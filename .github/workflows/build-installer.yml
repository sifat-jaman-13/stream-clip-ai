name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "dashboard/package-lock.json"

      - name: Build Creator Studio dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $programFiles = [Environment]::GetEnvironmentVariable("ProgramFiles")
          $iscc = @(
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
            (Join-Path $programFiles "Inno Setup 6\ISCC.exe")
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }

      - name: Build native WinUI 3 installer
        shell: pwsh
        run: .\build_native_installer.ps1

      - name: Upload native installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSnipAI-Native-Setup
          path: |
            dist/installer/StreamSnipAI-Native-Setup.exe
            dist/installer/StreamSnipAI-Native-Setup.exe.sha256

      - name: Attach native installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/StreamSnipAI-Native-Setup.exe
            dist/installer/StreamSnipAI-Native-Setup.exe.sha256
