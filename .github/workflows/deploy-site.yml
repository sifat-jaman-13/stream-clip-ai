name: Deploy website

on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments. Do not cancel an in-progress deployment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pages must be enabled once in repository Settings > Pages.
      # Do not ask GITHUB_TOKEN to create the Pages site: that operation
      # requires repository administration access unavailable to this token.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Upload website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs

      # Pages' artifact lookup uses a separate service from the public REST
      # artifact list. Allow the upload to propagate before that lookup.
      - name: Allow Pages artifact metadata to propagate
        run: sleep 15

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
