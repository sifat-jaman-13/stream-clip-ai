name: Deploy website

on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments. Do not cancel an in-progress deployment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # The upload action can finish before the Actions artifacts API exposes
      # the artifact to deploy-pages. Wait for the exact run's artifact list.
      - name: Wait for Pages artifact to become available
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = context.runId;
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            let lastError = null;

            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id,
                  per_page: 100,
                });

                const matches = data.artifacts.filter(
                  artifact => artifact.name === "github-pages" && !artifact.expired
                );

                if (matches.length === 1) {
                  core.info(`Pages artifact is available (ID ${matches[0].id}, attempt ${attempt}).`);
                  return;
                }

                if (matches.length > 1) {
                  core.setFailed(`Expected one github-pages artifact, found ${matches.length}.`);
                  return;
                }

                core.info(`Pages artifact not visible yet (attempt ${attempt}/12).`);
              } catch (error) {
                lastError = error;
                core.warning(`Could not list workflow artifacts on attempt ${attempt}: ${error.message}`);
              }

              if (attempt < 12) await sleep(5000);
            }

            core.setFailed(
              `The github-pages artifact did not become visible after 60 seconds.${lastError ? ` Last API error: ${lastError.message}` : ""}`
            );

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
