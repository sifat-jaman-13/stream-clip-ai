services:
  streamsnip-ai:
    build: .
    image: streamsnip-ai:latest
    container_name: streamsnip-ai
    init: true
    ports:
      - "127.0.0.1:8080:8080"  # Keep the local app private to this computer.
    volumes:
      - ./data:/data           # settings, custom words, clips, and recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STREAMSNIP_OLLAMA_URL: http://host.docker.internal:11434
    restart: unless-stopped
    stop_grace_period: 15s
    # Uncomment for headless live-stream mode (no web UI):
    # command: ["live", "https://www.twitch.tv/your_channel"]

    # Uncomment to process a local file (mount it first):
    # volumes:
    #   - ./my_vod.mp4:/data/rec/my_vod.mp4
    # command: ["file", "/data/rec/my_vod.mp4"]
