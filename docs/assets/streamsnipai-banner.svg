<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">StreamSnip AI — Find the moment. Make it a clip.</title>
<desc id="desc">A dark, cinematic banner with an AI video editing timeline, waveform, and vertical clip previews.</desc>
<defs>
