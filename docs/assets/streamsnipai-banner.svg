  <linearGradient id="violet" x2="1"><stop stop-color="#8f73e8"/><stop offset="1" stop-color="#c4b4ff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#b7d65a" stop-opacity=".22"/><stop offset="1" stop-color="#b7d65a" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d9e6d9" opacity=".18"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".42"/></filter>
</defs>
