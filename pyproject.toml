[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-clip-ai"
version = "4.1.0"
description = "Local-first StreamSnip creator studio with FastAPI, React, pywebview, Whisper, FFmpeg and Zernio publishing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Sifat Jaman" },
]
keywords = ["twitch", "youtube", "clips", "shorts", "reels", "streaming", "auto-clip", "ai-clipper", "whisper", "faster-whisper", "captions", "stream-clipper", "highlight-detection", "vertical-video", "ffmpeg", "ollama", "gemini", "local-ai", "zernio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "numpy>=1.24",
  "opencv-contrib-python-headless>=4.10,<5",
  "faster-whisper==1.2.1; python_version < '3.15'",
  "av>=11",
  "ctranslate2>=4.0,<5",
  "huggingface-hub>=0.21",
  "tokenizers>=0.13,<1",
  "tqdm>=4",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
desktop = [
  "pywebview>=6,<7",
  "pyinstaller>=6.19,<7",
]
gpu = [
  "nvidia-cublas-cu12; platform_system == 'Windows'",
]
live = [
  "streamlink",
]
all = [
  "streamlink",
  "nvidia-cublas-cu12; platform_system == 'Windows'",
]

[project.scripts]
autoclip = "autoclip:main"
streamclip = "autoclip:main"

[project.urls]
Homepage = "https://github.com/sifat-jaman-13/stream-clip-ai"
Repository = "https://github.com/sifat-jaman-13/stream-clip-ai"
Issues = "https://github.com/sifat-jaman-13/stream-clip-ai/issues"
Documentation = "https://github.com/sifat-jaman-13/stream-clip-ai#readme"
Changelog = "https://github.com/sifat-jaman-13/stream-clip-ai/blob/master/CHANGELOG.md"
Download = "https://github.com/sifat-jaman-13/stream-clip-ai/releases/latest"
Security = "https://github.com/sifat-jaman-13/stream-clip-ai/security/policy"

[tool.setuptools]
py-modules = ["autoclip", "api_server", "ai_highlights", "post_metadata", "zernio_poster", "zernio_connections", "facecam_detect", "secret_store", "desktop_shell"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.data-files]
"models" = ["models/face_detection_yunet_2023mar.onnx"]
