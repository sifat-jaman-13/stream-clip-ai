[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-clip-ai"
version = "1.0.1"
description = "Free AI-powered stream clipper — Twitch/YouTube live & VODs → 9:16 Shorts/TikTok/Reels with animated captions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Sifat Jaman" },
]
keywords = ["twitch", "youtube", "clips", "shorts", "tiktok", "reels", "streaming", "auto-clip", "ai-clipper", "whisper", "captions", "stream-clipper", "highlight-detection", "vertical-video"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "numpy>=1.24",
  "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
gpu = [
  "nvidia-cublas-cu12",
]
live = [
  "streamlink",
]
all = [
  "stream-clip-ai[gpu,live]",
]

[project.scripts]
autoclip = "autoclip:main"
streamclip = "autoclip:main"

[project.urls]
Homepage = "https://github.com/sifat-jaman-13/stream-clip-ai"
Repository = "https://github.com/sifat-jaman-13/stream-clip-ai"
Issues = "https://github.com/sifat-jaman-13/stream-clip-ai/issues"

[tool.setuptools]
py-modules = ["autoclip"]
